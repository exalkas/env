
<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Define gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B35A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055FF;stop-opacity:1" />
    </linearGradient>
    <style>
      .wordmark { font-family: 'Arial', sans-serif; font-size: 32px; fill: #0D254C; font-weight: bold; }
    </style>
  </defs>

  <!-- Hexagon shape -->
  <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="url(#grad1)" />

  <!-- Up-right arrow -->
  <path d="M30 70 L50 50 L40 50 L40 30 L60 30 L60 70 Z" fill="white" transform="rotate(-45 45 50)" />

  <!-- Down-left arrow -->
  <path d="M70 30 L50 50 L60 50 L60 70 L40 70 L40 30 Z" fill="white" transform="rotate(135 55 50)" />

  <!-- Wordmark -->
  <text x="110" y="60" class="wordmark">Emisify</text>
</svg>
